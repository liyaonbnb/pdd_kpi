services:
  postgres:
    image: postgres:16-alpine
    container_name: pdd_bi_v2_test_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: pdd_v2_test
      POSTGRES_USER: pdd_v2_test
      POSTGRES_PASSWORD: pdd_v2_test_local_2026
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - pdd_bi_v2_test_pgdata:/var/lib/postgresql/data
      - ../../v2/schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro

volumes:
  pdd_bi_v2_test_pgdata:
