name: Deploy to Server

on:
  push:
    branches: [master, main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Deploy to server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          debug: true
          script: |
            cd /home/ubuntu/pdd_kpi
            git fetch origin master
            git reset --hard origin/master
            echo "deployed_commit=$(git rev-parse HEAD)"
            ./venv/bin/pip install -r requirements.txt -q
            # 清理过时的字节码，避免运行时加载旧逻辑
            find . -type d -name __pycache__ -exec rm -rf {} + 2>/dev/null || true
            cd frontend
            npm ci
            npm run build
            cd ..
            sudo rm -rf /var/www/pdd_kpi/dist
            sudo cp -r frontend/dist /var/www/pdd_kpi/
            sudo chown -R www-data:www-data /var/www/pdd_kpi
            sudo chmod -R 755 /var/www/pdd_kpi
            # Provision the isolated V2 test database when the host has no
            # container runtime/PostgreSQL yet. All statements are idempotent.
            if ! command -v psql >/dev/null 2>&1; then
              sudo apt-get update -y
              sudo DEBIAN_FRONTEND=noninteractive apt-get install -y postgresql postgresql-client
            fi
            sudo systemctl enable --now postgresql
            sudo -u postgres psql -v ON_ERROR_STOP=1 -c "DO \$\$ BEGIN IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname='pdd_v2_test') THEN CREATE ROLE pdd_v2_test LOGIN PASSWORD 'pdd_v2_test_local_2026'; ELSE ALTER ROLE pdd_v2_test WITH LOGIN PASSWORD 'pdd_v2_test_local_2026'; END IF; END \$\$;"
            sudo -u postgres psql -v ON_ERROR_STOP=1 -tc "SELECT 1 FROM pg_database WHERE datname='pdd_v2_test'" | grep -q 1 || sudo -u postgres createdb -O pdd_v2_test pdd_v2_test
            sudo -u postgres psql -v ON_ERROR_STOP=1 -d pdd_v2_test -f v2/schema.sql
            sudo -u postgres psql -v ON_ERROR_STOP=1 -d pdd_v2_test -c "GRANT USAGE,CREATE ON SCHEMA public TO pdd_v2_test; GRANT ALL PRIVILEGES ON ALL TABLES IN SCHEMA public TO pdd_v2_test; GRANT ALL PRIVILEGES ON ALL SEQUENCES IN SCHEMA public TO pdd_v2_test; ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON TABLES TO pdd_v2_test; ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON SEQUENCES TO pdd_v2_test;"
            sudo -u postgres psql -v ON_ERROR_STOP=1 -d pdd_v2_test -c "DO \$\$ DECLARE r record; BEGIN FOR r IN SELECT tablename FROM pg_tables WHERE schemaname='public' LOOP EXECUTE format('ALTER TABLE public.%I OWNER TO pdd_v2_test', r.tablename); END LOOP; FOR r IN SELECT sequence_name FROM information_schema.sequences WHERE sequence_schema='public' LOOP EXECUTE format('ALTER SEQUENCE public.%I OWNER TO pdd_v2_test', r.sequence_name); END LOOP; END \$\$;"
            DEPLOY_DIR=$(pwd)
            DEPLOY_USER=$(id -un)
            sudo tee /etc/systemd/system/pdd-v2.service >/dev/null <<UNIT
            [Unit]
            Description=PDD KPI Dashboard V2 API
            After=network.target

            [Service]
            User=$DEPLOY_USER
            WorkingDirectory=$DEPLOY_DIR
            Environment=V2_DATABASE_URL=postgresql://pdd_v2_test:pdd_v2_test_local_2026@127.0.0.1:5432/pdd_v2_test
            ExecStart=$DEPLOY_DIR/venv/bin/uvicorn --app-dir $DEPLOY_DIR v2.test_api:app --host 0.0.0.0 --port 18001 --workers 1
            Restart=always
            RestartSec=3

            [Install]
            WantedBy=multi-user.target
            UNIT
            sudo systemctl daemon-reload
            sudo systemctl enable pdd-v2
            sudo systemctl restart pdd-v2
            sudo tee /etc/systemd/system/pdd-v2-web.service >/dev/null <<UNIT
            [Unit]
            Description=PDD BI Dashboard V2 Web
            After=network.target pdd-v2.service
            [Service]
            User=$DEPLOY_USER
            WorkingDirectory=$DEPLOY_DIR
            Environment=V2_WEB_DIST=$DEPLOY_DIR/frontend/dist
            Environment=V2_API_INTERNAL_URL=http://127.0.0.1:18001
            ExecStart=$DEPLOY_DIR/venv/bin/uvicorn --app-dir $DEPLOY_DIR v2.test_web:app --host 0.0.0.0 --port 18080 --workers 1
            Restart=always
            RestartSec=3
            [Install]
            WantedBy=multi-user.target
            UNIT
            sudo systemctl daemon-reload
            sudo systemctl enable pdd-v2-web
            sudo systemctl restart pdd-v2-web
            sudo systemctl restart pdd_kpi
            sudo systemctl reload nginx
            sudo systemctl is-active --quiet pdd_kpi
            sudo systemctl is-active --quiet pdd-v2
            sudo systemctl is-active --quiet pdd-v2-web
            echo "=== nginx routes ==="
            sudo nginx -T 2>/dev/null | grep -E 'listen |server_name|proxy_pass|18000|18080' || true
            echo "=== database diagnostics ==="
            ss -ltnp | grep -E ':5432|:55432' || true
            (docker ps --format '{{.Names}} {{.Ports}}' || true)
            (pg_isready -h 127.0.0.1 -p 5432 || true)
            (pg_isready -h 127.0.0.1 -p 55432 || true)
            sudo systemctl cat pdd-bi-v2-test pdd-bi-v2-test-db 2>/dev/null || true
            if ! (bash -c 'echo >/dev/tcp/127.0.0.1/55432') 2>/dev/null && ! (bash -c 'echo >/dev/tcp/127.0.0.1/5432') 2>/dev/null; then
              echo "V2 database is unavailable: no PostgreSQL listener on 5432 or 55432" >&2
              exit 1
            fi
            echo "=== v2 source ==="
            git rev-parse HEAD
            sha256sum v2/test_api.py v2/v1_compat.py
            ./venv/bin/python -c "import v2.test_api as m; print(m.__file__); print([r.path for r in m.app.routes if 'operations-daily' in getattr(r, 'path', '') or getattr(r, 'path', '') == '/api/users'])"
            echo "=== services ==="
            systemctl --no-pager --type=service --state=running | grep -Ei 'pdd|uvicorn|gunicorn|api' || true
            echo "=== listeners ==="
            ss -ltnp | grep -E ':8000|:18000|:18080' || true
            echo "=== pdd_kpi status ==="
            sudo systemctl --no-pager status pdd_kpi pdd-v2 || true
            echo "=== pdd_kpi unit ==="
            sudo systemctl cat pdd_kpi || true
            echo "=== pdd_kpi journal ==="
            sudo journalctl -u pdd_kpi -n 100 --no-pager || true
            echo "=== pdd-v2 journal ==="
            sudo journalctl -u pdd-v2 -n 120 --no-pager || true
            for i in $(seq 1 30); do
              if curl --fail --silent --show-error http://127.0.0.1:18001/health >/tmp/pdd-v2-health.json; then break; fi
              sleep 2
            done
            test -s /tmp/pdd-v2-health.json
            curl --fail --silent --show-error http://127.0.0.1:18001/openapi.json >/tmp/pdd-v2-openapi.json
            grep -q 'dashboard/operations-daily' /tmp/pdd-v2-openapi.json
            grep -q '"/api/users"' /tmp/pdd-v2-openapi.json
            curl --fail --silent --show-error http://127.0.0.1:18080/api/v2/config >/tmp/pdd-v2-web-config.json
            curl --fail --silent --show-error http://127.0.0.1:18080/api/dashboard/operations-daily >/tmp/pdd-v2-web-daily.json || test "$?" = 22

